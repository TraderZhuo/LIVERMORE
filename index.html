<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Livermore Says</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
        border: 1px solid #b8860b;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b8860b; 
      }
      
      /* Base Animation */
      @keyframes float {
        0% { transform: translateY(10px); opacity: 0; }
        100% { transform: translateY(0px); opacity: 1; }
      }

      /* Flowing Caret Animation */
      @keyframes caret-flow {
        0%, 100% { caret-color: #b8860b; }
        50% { caret-color: transparent; }
      }

      .caret-animate {
        animation: caret-flow 2s ease-in-out infinite;
      }

      /* Noise Texture */
      .bg-noise {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
      }
    </style>
